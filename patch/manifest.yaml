# 机器可读补丁清单 —— AI 改代码前先读这个文件
#   kind: new       = 纯新增文件，官方源码树里不存在
#   kind: overwrite = 覆盖官方已有文件（apply.sh 会先备份成 .wafbak）
#   depends_on      = 官方源码里的锚点，写成 "路径:符号"；check_upstream.sh 会 grep 是否还在
#                     以 runtime: 开头的锚点属于 openresty 运行时，不在源码树里检查
#   marker          = 覆盖文件里我们注入的标记，上游若重写该文件会丢失
version: 1
upstream:
  repo: 1Panel-dev/1Panel
  tag: v2.5.1
  go: "1.27.3"
  node: "22"
  edition: community
patch_root: patch
apply: patch/apply.sh
remove: patch/apply.sh --remove

# 全局检查：上游换版本时先看这几项
global_checks:
  - id: go-version
    what: "agent/go.mod 与 core/go.mod 的 go 指令"
    expected: "go 1.27.3"
  - id: node-version
    what: "frontend/package.json 的构建脚本 build:pro 与 Vite 版本"
    expected: "vite build --mode production"
  - id: router-glob
    what: "前端路由自动收集机制"
    expected: "frontend/src/routers/router.ts 含 import.meta.glob('./modules/*.ts')"
  - id: agent-forward
    what: "core 把非 /api/v2/core 请求转发给本地 agent"
    expected: "core/middleware/helper.go 含 ShouldProxyToAgent"
  - id: frontend-embed
    what: "前端资源 embed 进 core"
    expected: "core/cmd/server/web 含 go:embed all:assets"
  - id: echarts-major
    what: "ECharts 大版本（6.x 的 preserveAspect 行为与 5.x 不同）"
    expected: "6.x"

